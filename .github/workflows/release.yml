name: Release

# Triggered when you push a tag like v1.2.0
#
# Builds two artifacts and attaches them to the GitHub Release:
#   1. Fox Launcher Setup <version>.exe  (Electron installer via electron-builder)
#   2. kitsune-client-<version>.jar      (Fabric mod via Gradle)
#
# How to ship a new version:
#   git tag v1.2.0
#   git push origin v1.2.0
# GitHub creates the Release and this workflow uploads both files automatically.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write   # required to create the Release and upload assets

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Mod JAR (Gradle + JDK 25) ───────────────────────────────────────
      # build.gradle compiles to release 25 (MC 26.1.2), so the runner JDK must
      # be 25 — there is no Gradle toolchain pin, so Gradle uses the JDK it runs
      # under. Installing 21 here is what broke the first v1.3.0 release build.
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build mod JAR
        run: .\gradlew.bat build -x test

      # ── 3. Launcher installer (Node + electron-builder) ────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Install launcher dependencies
        working-directory: launcher
        run: npm ci

      # electron-builder --publish always creates the GitHub Release and
      # uploads the .exe + latest.yml (needed for in-app auto-update).
      - name: Build and publish launcher
        working-directory: launcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

      # ── 4. Attach mod JAR to the same Release ──────────────────────────────
      - name: Upload mod JAR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $jar = Get-ChildItem "build\libs\kitsune-client-*.jar" |
                   Where-Object { $_.Name -notmatch "sources|javadoc" } |
                   Sort-Object LastWriteTime -Descending |
                   Select-Object -First 1
          if (-not $jar) { Write-Error "No mod JAR found in build/libs"; exit 1 }
          Write-Host "Uploading $($jar.Name)"
          gh release upload "${{ github.ref_name }}" "$($jar.FullName)" --clobber

      # ── 5. Publish the release ─────────────────────────────────────────────
      # electron-builder creates the GitHub Release as a DRAFT, so once both
      # artifacts (.exe + latest.yml and the mod jar) are attached we flip it
      # public and mark it latest. Auto-update only sees published releases.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}"
          $ver  = $tag -replace '^v',''
          $repo = "${{ github.repository }}"
          # Fill the download-guidance template so users know to click the .exe
          # (GitHub can't reorder/hide the asset list, so the notes do the work).
          $notes = (Get-Content ".github/RELEASE_TEMPLATE.md" -Raw) `
                     -replace '\{\{VERSION\}\}', $ver `
                     -replace '\{\{TAG\}\}',     $tag `
                     -replace '\{\{REPO\}\}',    $repo
          $notes | Out-File -FilePath notes.md -Encoding utf8
          gh release edit "$tag" --draft=false --latest --notes-file notes.md

      # ── 5b. Verify release assets ──────────────────────────────────────────
      # Guardrail against the v1.5.0 failure mode: electron-builder silently
      # "skipped publishing" latest.yml + the installer because a published
      # release already existed, yet every step stayed green. If any of the
      # three required assets is missing we FAIL here — before the cleanup step
      # below deletes the previous (good) release — so a broken release can't
      # become "latest" and strand the launcher's self-update on a missing
      # latest.yml.
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $names = gh release view "$tag" --json assets --jq '.assets[].name'
          Write-Host "Assets on ${tag}:`n$names"
          $missing = @()
          if (-not ($names | Select-String -Quiet 'latest\.yml')) { $missing += 'latest.yml' }
          if (-not ($names | Select-String -Quiet 'Fox-Launcher-Setup-.*\.exe$')) { $missing += 'Fox-Launcher-Setup-*.exe' }
          if (-not ($names | Select-String -Quiet 'kitsune-client-.*\.jar$')) { $missing += 'kitsune-client-*.jar' }
          if ($missing.Count -gt 0) {
            Write-Error "Release $tag is missing required asset(s): $($missing -join ', '). Refusing to finish — the previous release is left intact as 'latest'."
            exit 1
          }
          Write-Host "All required assets present (latest.yml, installer, mod jar)."

      # ── 6. Delete old releases ─────────────────────────────────────────────
      # Only the latest release matters — new users always get the newest, and
      # existing users auto-update. Old releases just create confusion.
      #
      # Tolerant by design: a missing release or an already-deleted tag ref
      # must NOT fail the job (that aborted the first v1.3.0 cleanup). We delete
      # the release, then best-effort the tag, and always exit 0.
      - name: Delete old releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $current = "${{ github.ref_name }}"
          $old = gh release list --limit 100 --json tagName |
                   ConvertFrom-Json |
                   Where-Object { $_.tagName -ne $current }
          foreach ($r in $old) {
            Write-Host "Removing old release $($r.tagName)"
            gh release delete $r.tagName --yes 2>&1 | Out-Null
            # Best-effort tag cleanup — ignore "Reference does not exist".
            git push origin ":refs/tags/$($r.tagName)" 2>&1 | Out-Null
          }
          exit 0
