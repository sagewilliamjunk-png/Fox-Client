# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.2
loom_version=1.15.5
# Minecraft 26.x ships without obfuscation; disable loom's remap pipeline
fabric.loom.disableObfuscation=true

# Mod Properties
mod_version=1.6.0
maven_group=dev.kitsune.client
archives_base_name=kitsune-client

# Dependencies
# https://modrinth.com/mod/fabric-api
fabric_api_version=0.148.2+26.1.2
